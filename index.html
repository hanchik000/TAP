<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F3">
<title>TAP Business — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600;800&family=Montserrat:wght@400;600;800&family=Rubik:wght@400;600;700&family=Comfortaa:wght@400;700&family=Playfair+Display:wght@500;700&family=Lora:wght@400;600&family=Oswald:wght@400;600&family=Golos+Text:wght@400;600;700&family=Exo+2:wght@400;600;800&family=Prata&family=Raleway:wght@400;600;800&family=Nunito:wght@400;700;800&family=Cormorant+Garamond:wght@500;700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--base:#f5f5f3;--surf:#fff;--ink:#111;--g2:#2a2a2c;--mist2:#ecebe8;--mist3:#e2e1dd;--line:#e4e3df;--mut:#6f6f6a;--faint:#a3a39d;--acc:#c2612a;--acc2:#e08a4e;--accs:#f6e6da;--ok:#2c7a57;--warn:#a86d1c;--bad:#b4392f;--sel:#2f5bff;
 --sh:0 1px 2px rgba(17,17,17,.04),0 10px 30px -16px rgba(17,17,17,.16);--shl:0 2px 6px rgba(17,17,17,.05),0 24px 48px -24px rgba(17,17,17,.28);--shf:0 18px 50px -12px rgba(17,17,17,.45);
 --ease:cubic-bezier(.22,1,.36,1);--emph:cubic-bezier(.2,0,0,1);--disp:'Unbounded','Onest',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--base)}
body{background:var(--base);color:var(--ink);font:15px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--ink);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;cursor:pointer;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
input,select,textarea{width:100%;background:var(--surf);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:box-shadow .2s}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea{resize:vertical}
input[type=range]{padding:0;box-shadow:none;accent-color:var(--ink);background:none}
input[type=color]{padding:0;box-shadow:none;width:30px;height:30px;border-radius:8px;overflow:hidden;cursor:pointer}
.disp{font-family:var(--disp);font-weight:600;letter-spacing:-.025em;line-height:1.02;text-transform:uppercase}
h1{font-family:var(--disp);font-weight:600;letter-spacing:-.025em;line-height:1.02;text-transform:uppercase}
h2{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase;margin-bottom:6px}
h3{font-size:16px;font-weight:650}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.mono{font-family:var(--mono);letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:13px}.ml{margin-left:auto}.center{text-align:center;justify-content:center}
.row{display:flex;align-items:center;gap:10px}.g8{gap:8px}.g12{gap:12px}.wrap{flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.link{color:var(--ink);font-weight:600;text-decoration:underline;margin-top:12px}
.grad-t{background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.acc-g{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#9e4a1c)}
.dots-d{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.dots-l{position:absolute;inset:0;background-image:radial-gradient(rgba(17,17,17,.09) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.only-s{display:none!important}
@media (max-width:979px){.only-s{display:flex!important}.hide-s{display:none!important}}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes reveal{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,122,87,.45)}100%{box-shadow:0 0 0 10px rgba(44,122,87,0)}}
@keyframes fill{from{width:0}to{width:100%}}
.stagger>*{animation:rise .6s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:60ms}.stagger>*:nth-child(3){animation-delay:120ms}.stagger>*:nth-child(4){animation-delay:180ms}.stagger>*:nth-child(5){animation-delay:240ms}.stagger>*:nth-child(n+6){animation-delay:300ms}
@supports (animation-timeline:view()){.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 35%}}
.lift{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
@media (hover:hover){.lift:hover{transform:translateY(-3px);box-shadow:var(--shl)}}
.press{transition:transform .16s var(--ease)}.press:active{transform:scale(.97)}
.sheen{position:relative;overflow:hidden;isolation:isolate}.sheen::after{content:"";position:absolute;inset:-20% auto -20% 0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-120%) skewX(-18deg);animation:sweep 2.4s var(--emph) .4s both;pointer-events:none}
.float{animation:float 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14.5px;line-height:1;white-space:nowrap;transition:transform .16s var(--ease),background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.btn.red{background:var(--ink);color:#fff}.btn.red:hover{background:#262628}
.btn.acc{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#9e4a1c);color:#fff;box-shadow:0 10px 24px -10px rgba(194,97,42,.7)}
.btn.ghost{background:var(--surf);box-shadow:var(--sh)}.btn.ghost:hover{box-shadow:var(--shl)}
.btn.soft{background:var(--mist2)}.btn.soft:hover{background:var(--mist3)}
.btn.inv{background:#fff;color:var(--ink)}.btn.glass{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.btn.danger{color:var(--bad)}
.btn.lg{height:52px;padding:0 26px;font-size:15.5px}.btn.sm{height:36px;padding:0 14px;font-size:13.5px}.btn.full{width:100%}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;flex:none;transition:background .2s}.ib:hover{background:var(--mist2)}.ib.red{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;background:var(--surf);box-shadow:var(--sh);font-size:13.5px;font-weight:600;transition:background .2s,color .2s}
.chip svg{width:15px;height:15px}.chip.on{background:var(--ink);color:#fff}
.chip.ic{padding-left:5px}.chip.ic>span{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.chips.big .chip{height:44px;padding:0 18px;font-size:14.5px}
.chip-l{display:inline-grid;place-items:center;color:var(--mut)}
.seg{display:inline-flex;background:var(--mist2);border-radius:999px;padding:4px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;justify-content:center;padding:0 8px}
.card{background:var(--surf);border-radius:24px;padding:20px;box-shadow:var(--sh)}
.card.hl{box-shadow:0 0 0 2px var(--acc),var(--sh)}
.card.dim{opacity:.6}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--mist2);color:var(--mut)}
.tag.ok{background:#e3f0e9;color:var(--ok)}.tag.warn{background:#f7ebda;color:var(--warn)}.tag.bad{background:#f6e2df;color:var(--bad)}.tag.acc{background:var(--accs);color:#8f4316}
.fl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mut);margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.fl b{margin-left:auto;color:var(--ink);letter-spacing:0;text-transform:none;font-size:12px}
.in-l{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:12px;flex:1}
.in-l input,.in-l textarea,.in-l select{font-weight:400;color:var(--ink);font-size:15px}
.code-in{font-size:28px!important;letter-spacing:.5em;text-align:center;font-weight:700;font-family:var(--mono)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;opacity:.75}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-wait{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:14px 16px;background:var(--accs);border-radius:16px;color:#7a3a14;font-weight:600}
.ai-wait small{width:100%;font-weight:400;opacity:.75;margin-left:26px}
/* top bar */
.tb{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px max(18px,env(safe-area-inset-left));background:color-mix(in srgb,var(--base) 82%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px)}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:32px;height:32px;transition:transform .5s var(--ease)}.brand:hover svg{transform:rotate(-8deg)}
.brand span{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:3px}
.mode{margin-left:auto;display:flex;background:var(--surf);box-shadow:var(--sh);border-radius:999px;padding:4px}
.mode button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);transition:background .2s,color .2s}
.mode button.on{background:var(--ink);color:#fff}
.pg{max-width:1200px;margin:0 auto;padding:18px 18px 120px}
.narrow{max-width:470px;margin:0 auto}.wide{max-width:1140px;margin:0 auto}
.narrow h2{margin-top:8px}.narrow .btn.full{margin-top:10px}
.steps{display:flex;gap:6px;margin-bottom:22px;max-width:470px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--mist3)}.steps i.on{background:var(--ink)}
/* landing */
.l-hero{padding:22px 0 0}
.l-hero h1{font-size:clamp(32px,6vw,68px);max-width:15ch}
.ask{display:flex;align-items:center;gap:6px;background:var(--surf);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shl);max-width:760px;margin-top:28px;transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.ask:focus-within{box-shadow:0 0 0 2px var(--ink),var(--shl);transform:scale(1.01)}
.ask>svg{color:var(--acc);flex:none}
.ask input{box-shadow:none;background:none;height:48px;font-size:16px;padding:0 8px}.ask input:focus{box-shadow:none}
.ask .btn{height:48px}
.l-hero .chips{margin-top:16px}
.act-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:36px}
.act{display:flex;flex-direction:column;gap:26px;padding:20px;border-radius:24px;background:var(--surf);box-shadow:var(--sh);text-align:left;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.act:hover{transform:translateY(-2px);box-shadow:var(--shl)}
.act>span:first-child{width:44px;height:44px;border-radius:50%;background:var(--mist2);display:grid;place-items:center;transition:transform .5s var(--ease),background .3s,color .3s}
.act:hover>span:first-child{transform:scale(1.1);background:var(--ink);color:#fff}
.act b{display:block;font-size:13.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em}.act small{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.35}
.act.dk{background:#111;color:#fff}.act.dk>span:first-child{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#9e4a1c);color:#fff}.act.dk small{color:rgba(255,255,255,.55)}
@media (max-width:900px){.act-rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:30px -18px 0;padding:0 18px 6px;scrollbar-width:none}.act{flex:none;width:150px;scroll-snap-align:start}}
.dk-hero{position:relative;overflow:hidden;border-radius:32px;background:#111;color:#fff;margin-top:48px;display:grid;grid-template-columns:1.05fr 1fr}
.dk-hero .l{position:relative;padding:48px;display:flex;flex-direction:column;justify-content:center}
.dk-hero h2{font-size:clamp(30px,4.4vw,52px);margin:18px 0 0}
.dk-hero .eyebrow{color:rgba(255,255,255,.5)}
.dk-list{list-style:none;margin:24px 0 30px;display:flex;flex-direction:column;gap:8px;font-size:17px;color:rgba(255,255,255,.72)}
.dk-list li{display:flex;gap:14px;align-items:baseline}.dk-list .mono{font-size:11px;color:rgba(255,255,255,.35)}
.dk-hero .r{position:relative;min-height:520px;display:grid;place-items:center;padding:30px}
.ld-phone{width:min(290px,72vw);aspect-ratio:9/18.6;border-radius:42px;background:#1d1d1f;padding:9px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08)}
.ld-screen{width:100%;height:100%;border-radius:34px;overflow:hidden;position:relative;background:#fff}
.ld-in{width:390px;transform-origin:0 0;position:absolute;top:0;left:0;pointer-events:none;animation:fd .6s var(--ease)}
.ld-cap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.55);white-space:nowrap}
@media (max-width:860px){.dk-hero{grid-template-columns:1fr}.dk-hero .l{padding:28px 24px 0}.dk-hero .r{min-height:auto;padding:30px 0 60px}}
.mq{overflow:hidden;margin:44px -18px 0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq-t{display:flex;width:max-content;animation:marquee 38s linear infinite}
.mq-t span{display:flex;align-items:center;gap:22px;padding-right:22px;font-family:var(--disp);font-size:clamp(20px,3vw,34px);font-weight:600;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap}
.mq-t span i{font-style:normal;color:var(--acc);font-size:.6em}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:56px 0 18px}
.sec-h h2{font-family:Onest,sans-serif;font-size:21px;font-weight:650;letter-spacing:.02em;margin:0}.sec-h p{font-size:13px;color:var(--mut);margin-top:2px}
.rail{display:grid;grid-auto-flow:column;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;scrollbar-width:none;margin:0 -18px;padding:4px 18px 16px}
.rail::-webkit-scrollbar{display:none}.rail>*{scroll-snap-align:start}
.tcard{width:300px;border-radius:24px;background:var(--surf);box-shadow:var(--sh);overflow:hidden;text-align:left}
.tcard .tpl-th{aspect-ratio:4/3.2;position:relative;overflow:hidden;background:var(--mist2)}
.tcard .tpl-n{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.tcard .tpl-n b{font-size:15px}.tcard .tpl-n span{font-size:12.5px;color:var(--mut)}
.eco{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.eco>div{border-radius:28px;padding:26px;background:var(--surf);box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.eco>div.dk{background:#111;color:#fff}.eco>div.dk p{color:rgba(255,255,255,.6)}.eco p{font-size:14px;color:var(--mut)}
.eco h3{font-family:var(--disp);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:-.02em}
.eco .btn{margin-top:auto}
@media (max-width:860px){.eco{grid-template-columns:1fr}}
.foot{margin-top:56px;border-radius:32px 32px 0 0;background:#111;color:rgba(255,255,255,.6);padding:34px 28px 120px;font-size:13px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;margin-left:-18px;margin-right:-18px}
.foot b{color:#fff;font-family:var(--disp);font-size:16px}
/* start */
.start-g{display:grid;grid-template-columns:420px 1fr;gap:22px;margin-top:18px;align-items:start}
.ai-card{background:#111;color:#fff;position:sticky;top:78px;overflow:hidden;border-radius:28px;padding:24px}
.ai-card>*{position:relative}
.ai-card .in-l,.ai-card .fl{color:rgba(255,255,255,.55)}.ai-card textarea{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff}
.ai-card textarea:focus{box-shadow:inset 0 0 0 2px #fff}
.ai-card h3{font-family:var(--disp);text-transform:uppercase;font-weight:600;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.up-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.up-th{width:66px;height:66px;border-radius:16px;background:center/cover;position:relative}
.up-th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}.up-th button svg{width:14px}
.up-add{width:66px;height:66px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;gap:2px}
.ai-card .ai-wait{background:rgba(255,255,255,.08);color:#fff}
.tpl-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tpl{background:var(--surf);border-radius:24px;overflow:hidden;text-align:left;box-shadow:var(--sh)}
.tpl-th{aspect-ratio:4/3.2;position:relative;overflow:hidden}
.tpl-n{padding:12px 16px 14px;display:flex;flex-direction:column}.tpl-n span{font-size:12.5px;color:var(--mut)}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.thumb.sm{aspect-ratio:16/8}
.thumb-in{width:1200px;transform-origin:0 0;position:absolute;top:0;left:0;pointer-events:none}
@media (max-width:900px){.start-g{grid-template-columns:1fr}.ai-card{position:relative;top:0}}
/* publish */
.tar-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 8px}
.tar{background:var(--surf);border-radius:24px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--sh);transition:box-shadow .2s,transform .3s var(--ease)}
.tar.on{box-shadow:0 0 0 2px var(--ink),var(--shl)}
.tar>b{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}.tar-p{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.tar-p small{font-size:12.5px;font-weight:500;color:var(--mut);letter-spacing:0}

.scene{position:absolute;inset:0}

.ts-t1{text-align:center;max-width:860px}.ts-t1 .ts-lead{margin:0 auto}.ts-t2{align-items:start}.ts-t2 .ts-lead{margin:0}

/* reveal + entrance (published only) */
.ts .rise>*{animation:rise .7s cubic-bezier(.22,1,.36,1) both}.ts .rise>*:nth-child(2){animation-delay:.08s}.ts .rise>*:nth-child(3){animation-delay:.16s}.ts .rise>*:nth-child(4){animation-delay:.24s}
